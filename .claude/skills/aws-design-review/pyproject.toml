[project]
name = "aws-design-sheet"
version = "0.11.0"
description = "Traceable AWS design workbooks, required-input and project-policy checks"
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3", "openpyxl>=3.1,<4", "regex>=2024.9", "cryptography>=44,<47", "defusedxml>=0.7,<1", "lxml>=5.3,<7", "tzdata==2026.4", "PyYAML>=6,<7", "cfn-lint>=1.57,<2", "jsonschema>=4.26,<5"]

[project.optional-dependencies]
llm = ["anthropic>=1"]
validation = ["cloudformation-validate>=1.12,<2"]

[project.scripts]
aws-design = "aws_design_sheet.command:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
